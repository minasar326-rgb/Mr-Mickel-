    <script>
      // Clean noise, message channel closure, and extension violations
      (function() {
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason) {
            var msg = String(event.reason.message || event.reason);
            if (
              msg.includes('message channel closed') ||
              msg.includes('A listener indicated an asynchronous response') ||
              msg.includes('pdf-viewer-detect')
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }
        }, true);

        var _log = console.log;
        var _warn = console.warn;
        var _error = console.error;

        console.log = function() {
          var first = arguments[0];
          if (typeof first === 'string' && (first.includes('pdf-viewer-detect') || first.includes('shortcutFormat') || first.includes('isBrowserPdfViewerPage'))) {
            return;
          }
          _log.apply(console, arguments);
        };

        console.warn = function() {
          var first = arguments[0];
          if (typeof first === 'string' && (
            first.includes('unload') || 
            first.includes('Permissions policy violation') ||
            first.includes('Cross-Origin-Opener-Policy')
          )) {
            return;
          }
          _warn.apply(console, arguments);
        };

        console.error = function() {
          var first = arguments[0];
          if (typeof first === 'string' && (
            first.includes('message channel closed') ||
            first.includes('A listener indicated an asynchronous response') ||
            first.includes('pdf-viewer-detect') ||
            first.includes('Cross-Origin-Opener-Policy')
          )) {
            return;
          }
          _error.apply(console, arguments);
        };
      })();
