<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تصدير صور متجر Google Play الرسمية | The Master LMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: #0B0F19;
      color: white;
      margin: 0;
      padding: 2rem;
      text-align: center;
    }
    .card {
      background: #1E293B;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 1.5rem;
      margin: 2rem auto;
      max-width: 1100px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    canvas {
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      max-width: 100%;
      height: auto;
    }
    button {
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 800;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 1rem;
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4);
    }
    button:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <h1>🎨 مولد وتصدير تصميمات Google Play Store الرسمية</h1>
  <p style="color: #94A3B8;">تم توليد هذه التصميمات بدقة البكسل المطلوبة رسمياً لمتجر جوجل بلاي 2026</p>

  <!-- 1. App Icon (512x512) -->
  <div class="card">
    <h2>1. أيقونة التطبيق الرسمية (App Icon - 512 × 512 px)</h2>
    <canvas id="iconCanvas" width="512" height="512"></canvas>
    <br>
    <button onclick="downloadCanvas('iconCanvas', 'app-icon-512x512.png')">
      ⬇️ تحميل أيقونة التطبيق (512x512 PNG)
    </button>
  </div>

  <!-- 2. Feature Graphic (1024x500) -->
  <div class="card">
    <h2>2. الرسم المميز للمتجر (Feature Graphic - 1024 × 500 px)</h2>
    <canvas id="featureCanvas" width="1024" height="500"></canvas>
    <br>
    <button onclick="downloadCanvas('featureCanvas', 'feature-graphic-1024x500.png')">
      ⬇️ تحميل الرسم المميز (1024x500 PNG)
    </button>
  </div>

  <script>
    window.onload = function() {
      drawIcon();
      drawFeature();
    };

    function drawIcon() {
      const c = document.getElementById('iconCanvas');
      const ctx = c.getContext('2d');

      // Gradient Background
      const bgGrad = ctx.createLinearGradient(0, 0, 512, 512);
      bgGrad.addColorStop(0, '#0F172A');
      bgGrad.addColorStop(0.5, '#1E1B4B');
      bgGrad.addColorStop(1, '#312E81');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 512, 512);

      // Outer Glow Ring
      ctx.strokeStyle = 'rgba(99, 102, 241, 0.4)';
      ctx.lineWidth = 14;
      ctx.strokeRect(20, 20, 472, 472);

      // Inner Badge Box
      const innerGrad = ctx.createLinearGradient(100, 100, 412, 412);
      innerGrad.addColorStop(0, '#4F46E5');
      innerGrad.addColorStop(1, '#7C3AED');
      ctx.fillStyle = innerGrad;
      roundRect(ctx, 80, 80, 352, 352, 60, true, false);

      // MS Monogram
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 130px "Plus Jakarta Sans", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('MS', 256, 260);

      // Gold Subtext
      ctx.fillStyle = '#FCD34D';
      ctx.font = '800 30px "Cairo", sans-serif';
      ctx.fillText('THE MASTER', 256, 320);

      // English Flag icon
      ctx.font = '40px sans-serif';
      ctx.fillText('🇬🇧', 256, 380);
    }

    function drawFeature() {
      const c = document.getElementById('featureCanvas');
      const ctx = c.getContext('2d');

      // Background Gradient
      const bgGrad = ctx.createLinearGradient(0, 0, 1024, 500);
      bgGrad.addColorStop(0, '#0B0F19');
      bgGrad.addColorStop(0.5, '#1E1B4B');
      bgGrad.addColorStop(1, '#0F172A');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 1024, 500);

      // Decorative Circles
      ctx.fillStyle = 'rgba(79, 70, 229, 0.15)';
      ctx.beginPath();
      ctx.arc(850, 100, 200, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(124, 58, 237, 0.12)';
      ctx.beginPath();
      ctx.arc(150, 400, 180, 0, Math.PI * 2);
      ctx.fill();

      // Main Badge
      ctx.fillStyle = '#4F46E5';
      roundRect(ctx, 80, 60, 110, 110, 24, true, false);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 52px "Plus Jakarta Sans", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('MS', 135, 135);

      // Teacher Name
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 52px "Cairo", sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText('منصة مستر مايكل شحاته 🇬🇧', 940, 140);

      // Title
      ctx.fillStyle = '#FCD34D';
      ctx.font = '800 32px "Cairo", sans-serif';
      ctx.fillText('THE MASTER OF ENGLISH • ثانوية عامة 2026', 940, 200);

      // Description line
      ctx.fillStyle = '#94A3B8';
      ctx.font = '600 24px "Cairo", sans-serif';
      ctx.fillText('المنصة الرسمية الأولى لطلاب الثانوية العامة واللغات - شرح وتدريبات وبنك أسئلة', 940, 255);

      // Feature Pills
      const pills = [
        '🎬 محاضرات HD تفاعلية',
        '📝 امتحانات وتصحيح تلقائي',
        '📚 مذكرات The Master',
        '🏆 لوحة الشرف للأوائل'
      ];

      let startX = 940;
      ctx.textAlign = 'right';
      pills.forEach((pill, idx) => {
        const y = 330 + (idx % 2) * 60;
        const x = idx < 2 ? 940 : 540;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
        roundRect(ctx, x - 360, y - 35, 360, 48, 24, true, false);
        ctx.fillStyle = '#38BDF8';
        ctx.font = '700 20px "Cairo", sans-serif';
        ctx.fillText(pill, x - 25, y);
      });
    }

    function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      if (fill) ctx.fill();
      if (stroke) ctx.stroke();
    }

    function downloadCanvas(canvasId, filename) {
      const canvas = document.getElementById(canvasId);
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
